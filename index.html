<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a1c14" />
    <meta
      name="description"
      content="Unofficial offline companion for Red Dead Redemption 2 — missions, missables, treasures, and progression."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>RDR2 Complete Guide</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rdr2-theme');
          if (t === 'parchment' || t === 'campfire') {
            document.documentElement.setAttribute('data-theme', t);
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'parchment');
          } else {
            document.documentElement.setAttribute('data-theme', 'campfire');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'campfire');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
